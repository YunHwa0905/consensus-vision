apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          # 일부러 PVC를 안 붙임 — 파드가 재시작되면 캐시가 초기화되는 걸
          # Phase 2 검증 포인트로 그대로 보여주기 위함 (MySQL은 PVC로 영구 보존과 대비)
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
