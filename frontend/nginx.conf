resolver 10.96.0.10 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # 변수에 담아서 proxy_pass하면 nginx가 시작 시점이 아니라 "요청이 올 때마다"
        # 위 resolver로 DNS를 새로 조회함 - backend-service DNS가 잠깐 불안정해도
        # nginx 자체가 죽지 않고, 재시도 시점에 다시 정상 조회되면 바로 복구됨
        set $backend_upstream "backend-service.webapp.svc.cluster.local";
        proxy_pass http://$backend_upstream:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
